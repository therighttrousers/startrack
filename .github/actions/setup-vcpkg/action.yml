name: setup-vcpkg

description: Bootstraps vcpkg and sets up binary caching with NuGet

runs: 
  using: composite
  steps:
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./vcpkg/bootstrap-vcpkg.bat

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: ./vcpkg/bootstrap-vcpkg.sh

    - name: Set up NuGet Credentials
      shell: 'bash'
      env:
        MONO: ${{ case(runner.os == 'Windows', '', '') }}
      run: |
        $MONO `./vcpkg/vcpkg fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/therighttrousers/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "therighttrousers" \
          -password "${{ github.token }}"
        $MONO `./vcpkg/vcpkg fetch nuget | tail -n 1` \
          setapikey "${{ github.token }}" \
          -source "https://nuget.pkg.github.com/therighttrousers/index.json"
