name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build+Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc-debug
          - os: ubuntu-latest
            preset: gcc-debug
          - os: ubuntu-latest
            preset: clang-debug
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_COMPILE_WARNING_AS_ERROR: "ON"
    steps:
      - uses: actions/checkout@v7
      # Prerequisites
      - uses: lukka/get-cmake@v4.4.2
      - uses: lukka/run-vcpkg@v11.6
      # Set up developer command prompt on Windows
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      # Configure, build, test
      - run: cmake --workflow --preset ${{ matrix.preset }}
      # Ensure the working directory is clean
      - run: git diff --quiet && git diff --cached --quiet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: lukka/run-vcpkg@v11.6
      - run: cmake --preset clang-debug
      # TODO: Run clang-tidy with pinned version
      # Check relative links and heading anchors in Markdown files, skipping external URLs (--offline)
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          failIfEmpty: false
          fail: true

  format:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TODO: Run "clang-format --dry-run --Werror" with pinned version

  # Branch ruleset check
  ci-ok:
    if: always()
    needs: [build-test, lint, format]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
