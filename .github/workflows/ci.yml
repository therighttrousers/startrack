name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build+Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc-debug
          - os: ubuntu-latest
            preset: gcc-debug
          - os: ubuntu-latest
            preset: clang-debug
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_COMPILE_WARNING_AS_ERROR: "ON"
    steps:
      - uses: actions/checkout@v7
      # Prerequisites
      - uses: lukka/get-cmake@v4.4.2
      - uses: lukka/run-vcpkg@v11.6
      # Set up developer command prompt on Windows
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      # Configure, build, test
      - run: cmake --workflow --preset ${{ matrix.preset }}
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes or untracked files detected!"
            git status
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.2
      - uses: lukka/run-vcpkg@v11.6
      - run: cmake --preset clang-debug
      # TODO: Run clang-tidy with pinned version

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TODO: Run "clang-format --dry-run --Werror" with pinned version

  # Branch ruleset check
  ci-ok:
    if: always()
    needs: [build-test, lint, format]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
