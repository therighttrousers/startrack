name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build+Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc-debug
          - os: ubuntu-latest
            preset: gcc-debug
          - os: ubuntu-latest
            preset: clang-debug
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Windows x64 dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Ensure no repo changes
        run: |
          git add -A
          git diff --cached --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check builtin-baseline == vcpkg commit hash
        run: |
          BUILTIN_BASELINE=`node -p "require('./vcpkg.json')['builtin-baseline']"`
          COMMIT_HASH=`git -C vcpkg rev-parse HEAD`
          if [[ "$BUILTIN_BASELINE" != "$COMMIT_HASH" ]]; then
            echo "::error::builtin-baseline in vcpkg.json does not match vcpkg submodule commit hash ($BUILTIN_BASELINE != $COMMIT_HASH)!"
            exit 1
          fi

      - name: Install CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure
        run: cmake --preset clang-debug
      
      - name: Run clang-tidy
        run: |
          echo "TODO: clang-tidy <args> (pinned version)"

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run clang-format
        run: |
          echo "TODO: clang-format --dry-run --Werror (pinned version)"

  # Branch ruleset check
  ci-ok:
    if: always()
    needs: [build-test, lint, format]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
